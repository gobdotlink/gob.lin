name: Build

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke-check package
        run: scripts/smoke.sh
      - name: Check dictionary and text-processing guardrails
        run: swift test
      - name: Check provider credential preflight and prompt-free submissions
        run: scripts/check-rewrite-credentials.sh
      - name: Check updater protocol and installation recovery
        run: scripts/check-updates.sh
      - name: Check live delivery and finalization
        run: scripts/check-live-delivery.sh && scripts/check-live-transcription.sh
      - name: Check capture integrity and media ownership
        run: scripts/check-audio-capture.sh && scripts/check-feedback-media.sh
      - name: Build Xcode app without local signing credentials
        run: xcodebuild -project Goblin.xcodeproj -scheme Goblin -configuration Release -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Build the shared libraries for iPhone
        run: xcodebuild -scheme GoblinEngines -destination generic/platform=iOS -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
