name: Release

# Runs only for version tags pushed by scripts/release.sh. Signing secrets live in the
# `release` environment, which accepts v* tags only; pull requests never reach this job.
on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is a new release commit on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)" = "$version"
          # The updater reads only the latest release, so never publish behind it,
          # for example when re-running a superseded tag's failed workflow.
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [ "$latest" = "$GITHUB_REF_NAME" ] || [ "$(printf '%s\n' "$latest" "$GITHUB_REF_NAME" | sort -V | tail -n 1)" != "$GITHUB_REF_NAME" ]; then
            echo "::error::$GITHUB_REF_NAME is not newer than the latest release, $latest."
            exit 1
          fi

      # Compile before any key exists on the runner, so build tools never run beside it.
      - name: Build
        run: swift build -c release

      - name: Load signing and notarization credentials
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf %s "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          xcrun notarytool store-credentials goblin-notary --keychain "$keychain" \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" >/dev/null
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application: /{print $2; exit}')
          test -n "$identity"
          echo "GOBLIN_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Sign, notarize and package
        run: scripts/package-app.sh

      - name: Refuse anything Gatekeeper would reject
        run: spctl --assess --type execute --verbose .build/app/gob.lin.app

      # A draft keeps incomplete asset uploads out of the app's update channel.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="dist/gob.lin-${GITHUB_REF_NAME#v}.zip"
          gh release create "$GITHUB_REF_NAME" dist/gob.lin.dmg "$archive" "$archive.sha256" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes --draft \
            --notes "New to gob.lin, or told an update does not match its signing identity? Follow the [install steps](https://github.com/$GITHUB_REPOSITORY#install)."
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
