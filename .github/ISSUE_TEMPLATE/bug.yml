name: Bug report
description: Report a reproducible problem using non-sensitive data.
body:
  - type: markdown
    attributes:
      value: "For security issues, use SECURITY.md. Do not attach private recordings, transcripts, diagnostics, or API keys."
  - type: textarea
    id: behavior
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce with synthetic data
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: gob.lin and macOS versions
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Relevant sanitized errors or screenshots
